name = "obavia-auction"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
DEV = "0"

# Nightly: payouts left owed go out to dealers with a connected account (src/index.ts sendAllOwed), then the
# reconciliation (src/reconcile.ts). 08:00 UTC is 03:00 Central in daylight time, 02:00 in standard time.
[triggers]
crons = ["0 8 * * *"]

[[durable_objects.bindings]]
name = "AUCTION"
class_name = "Auction"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Auction"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "obavia-auction-files"

[[d1_databases]]
binding = "DB"
database_name = "obavia-auction"
database_id = "replace-with-the-id-wrangler-prints"
migrations_dir = "migrations"

# Secrets (wrangler secret put): BUYER_SECRET, DEALER_SECRET, MINT_SECRET (POST /dealers/mint only), WHOP_API_KEY, WHOP_WEBHOOK_SECRET, TELNYX_API_KEY
# Vars to set: WHOP_ACCOUNT_ID (biz_…), WHOP_API_BASE (sandbox in staging), TELNYX_VERIFY_PROFILE_ID
# Migrations: 0014 before this code (bid_attempts for the bids-per-buyer limit, reconciliations.differences); 0013 before the earlier code (dealer_payouts.method, reconciliations.payouts_owed, the one-phone-one-buyer index)
