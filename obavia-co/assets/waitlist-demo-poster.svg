<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="A still of the next question on screen">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4ECFB"/>
      <stop offset="0.55" stop-color="#F4F7FF"/>
      <stop offset="1" stop-color="#E7EEF8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g fill="#ffffff" filter="url(#soft)">
    <ellipse cx="260" cy="160" rx="250" ry="78" opacity=".9"/>
    <ellipse cx="1320" cy="120" rx="280" ry="86" opacity=".85"/>
    <ellipse cx="1180" cy="780" rx="340" ry="96" opacity=".8"/>
    <ellipse cx="180" cy="760" rx="220" ry="70" opacity=".75"/>
  </g>
  <rect x="390" y="186" width="820" height="528" rx="40" fill="#ffffff" fill-opacity=".78" stroke="#ffffff" stroke-width="2"/>
  <text x="446" y="268" fill="#4E66A0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1.6">NEXT QUESTION</text>
  <text x="446" y="360" fill="#1c2640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="600">Too expensive compared</text>
  <text x="446" y="422" fill="#1c2640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="600">to what you planned, or</text>
  <text x="446" y="484" fill="#1c2640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="600">to what you expect back?</text>
  <text x="446" y="620" fill="#4a5874" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24">Ask it while the buyer is still talking.</text>
</svg>
