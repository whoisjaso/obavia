<!-- The first viewport (lego.md section 8, CP1): two pieces, no connector. The lane as built on a phone,
     and the one cloud button inside the one cloud card. The headline is written in the register of the
     buyer hooks (messaging-hooks.md section 1); BV1 to BV5 each need a live lot's price, time and dealer,
     and no lot is live. -->
<section class="hero wl-hero" id="top">
  <div class="wrap">
    <div class="copy">
      <h1 data-r>Bidders set the price.</h1>
      <!-- POST /api/waitlist with {email}, a body deploy/site/live-worker.js handleWaitlist accepts today.
           No other field is sent. The hidden website field is a trap; when it is filled nothing is sent. -->
      <div class="wl-card" id="wl" data-r>

          <label class="wl-vh" for="wlEmail">Email</label>
          <input id="wlEmail" name="email" type="email" maxlength="254" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="email" enterkeyhint="send" placeholder="Your email" required aria-describedby="wlSay">
          <div class="trap" aria-hidden="true"><label for="wlSite">Website</label><input id="wlSite" name="website" tabindex="-1" autocomplete="off"></div>
          <button class="btn cloud" id="wlBtn" type="submit" data-cloud3d>Get early access</button>
          <p class="wl-say" id="wlSay" role="status" aria-live="polite"></p>
        </form>
        <div class="wl-done" id="wlDone" tabindex="-1" hidden>
          <span class="wl-tick" data-obi="check" data-size="46" aria-hidden="true"></span>
          <p class="wl-addr" id="wlAddr"></p>
          <p class="wl-vh" id="wlHeard">You’re on the list.</p>

        <noscript><p class="wl-say">Turn on JavaScript to sign up.</p></noscript>
      </div>
    </div>
    <!-- auction/shots/1c-lane.png, the Lane as the app renders it today, cropped above the Bid and Retail bars
         (the Retail bar is counsel question 7). The car is seeded and its photo generated, and the caption says so. -->

      <figcaption>The app as built. Seeded car, generated photo.</figcaption>

<script>
/* The sign-up: one email, one press. Posts {email} to POST /api/waitlist on obavia.co (and on localhost for
   previews, as lane-apply.js does). The proof is the body, not a sentence: the card breathes once with the
   landed sound and a haptic (site.js OBV.cloud.landed), and the address the person typed lands where the
   field was. A screen reader hears "You're on the list." */
(() => {
const $ = id => document.getElementById(id);
const card = $('wl'), form = $('wlForm'), email = $('wlEmail'), trap = $('wlSite'), btn = $('wlBtn'), say = $('wlSay'), done = $('wlDone'), addr = $('wlAddr');
const LIVE = ['https://obavia.co', 'https://www.obavia.co'].includes(location.origin) || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const ENDPOINT = LIVE ? new URL(form.dataset.endpoint || '/api/waitlist', location.origin).href : null;
const tell = t => { say.textContent = t; };
const still = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
let busy = false, wait = 0;

const land = value => {
  addr.textContent = value;
  form.hidden = true; done.hidden = false; card.classList.add('in');
  done.focus({ preventScroll: true });
  if (window.OSHELL) OSHELL.haptic();
  if (window.OBV && OBV.cloud) OBV.cloud.landed(card);
};

email.addEventListener('input', () => { if (email.hasAttribute('aria-invalid')) { email.removeAttribute('aria-invalid'); tell(''); } });

form.addEventListener('submit', async e => {
  e.preventDefault();
  if (busy || wait > Date.now()) return;
  const value = email.value.trim();
  if (!value || value.length > 254 || !email.checkValidity()) {
    email.setAttribute('aria-invalid', 'true'); tell('Check the address.'); email.focus(); return;
  }
  if (trap.value) return;                                   // the hidden field is filled only by bots
  if (!ENDPOINT) { tell('This preview doesn’t save sign-ups. They open on obavia.co.'); return; }
  busy = true; btn.disabled = true; btn.setAttribute('aria-busy', 'true'); tell('');
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 12000);
  try {
    const r = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'omit', signal: ctl.signal,
      body: JSON.stringify({ email: value }) });
    const d = await r.json().catch(() => null);
    if (r.ok && d && d.status === 'accepted') { land(value); return; }
    if (r.status === 422) { email.setAttribute('aria-invalid', 'true'); tell('Check the address and try again.'); email.focus(); }
    else if (r.status === 429) {
      const v = r.headers.get('Retry-After'), s = Math.max(30, Number(v) || Math.ceil((Date.parse(v) - Date.now()) / 1000) || 60);
      wait = Date.now() + s * 1000;
      tell(s >= 3600 ? 'Too many tries from here. Try again in an hour.' : `Too many tries from here. Try again in ${Math.ceil(s / 60)} minutes.`);
    }
    else tell('That didn’t save. Try again.');
  } catch { tell('No connection. Try again.'); }
  finally { clearTimeout(timer); busy = false; btn.disabled = false; btn.removeAttribute('aria-busy'); }
});

// The close sends the thumb back to the one field, not to a second form.
document.querySelectorAll('[data-go="wl"]').forEach(b => b.addEventListener('click', () => {
  scrollTo({ top: 0, behavior: still() ? 'auto' : 'smooth' });
  setTimeout(() => (done.hidden ? email : done).focus({ preventScroll: true }), still() ? 0 : 480);
}));
})();
</script>
