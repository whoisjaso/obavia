<!-- The results page (DOCTRINE CP5, growth plan CP5 row; lego.md section 8, "aligned"): the numbers the lane's own
     server keeps, each in Bodoni touching its words, the date of the last reconciliation as the provenance line, and
     one action. Every value comes from GET /results on the auction Worker (auction/worker/README.md), which returns
     aggregate counts only: no name, no GDN, no lot id, no dollar amount per lot, no fee (43 TAC section 215.85).
     Nothing here is a claim about an outcome; a null from the Worker reads "Not read".

     The date line reads "Checked <date>." (DOCTRINE section 4 rule 11: no five-syllable word where one will do).

     WORKER URL: the site does not yet know the auction Worker's origin (index.html and lane-apply.js reach only
     /api/waitlist on obavia.co). data-worker below is a PLACEHOLDER; set it to the Worker's https origin
     (wrangler.toml, name "obavia-auction") when it is deployed. Until then every number reads "Not read".
     obavia-co/_headers sends connect-src 'self'; that origin must be added there too, or the browser blocks the read. -->
<section class="hero rs-hero" id="top" data-worker="PLACEHOLDER" data-path="/results" data-seeded="true">
  <div class="wrap">
    <div class="copy">
      <h1 data-r>The lane so far.</h1>
    </div>
    <!-- House law: a seeded number says so. data-seeded="true" above keeps this word on the glass while the figures behind
         the page are the seeded fixture; it becomes "false" in the same edit that sets data-worker to the live origin, once
         the lane's own numbers replace it (simplicity-audit.md section 3 row 5, 2026-10-13). -->
    <p class="rs-seeded" id="rsSeeded" data-r>Seeded</p>
    <ol class="rs-rows slab" id="rsRows" data-r aria-busy="true">
      <li><b class="m rs-n" data-k="lotsOpened">&nbsp;</b><span>Cars listed</span></li>
      <li><b class="m rs-n" data-k="carsSold">&nbsp;</b><span>Cars sold</span></li>
      <li><b class="m rs-n" data-k="carsStarted">&nbsp;</b><span>Started at pickup</span></li>
      <li><b class="m rs-n" data-k="depositsRefunded">&nbsp;</b><span>Deposits back in full</span></li>
      <li><b class="m rs-n" data-k="reserveRatio">&nbsp;</b><span>Reserve ratio</span></li>
      <li><b class="m rs-n" data-k="disputes">&nbsp;</b><span>Disputes</span></li>
      <li><b class="m rs-n" data-k="nightsEqual">&nbsp;</b><span>Nights the ledger matched</span></li>
    </ol>
    <p class="rs-when" id="rsWhen" data-r role="status" aria-live="polite">Reading.</p>
    <div class="act" data-r><a class="btn cloud" href="index.html#apply">Get on the lane</a></div>
  </div>
</section>

<script>
/* The one read. GET <data-worker><data-path>, no credentials, eight seconds. A number lands as a number; a null
   lands as "Not read"; a failed read, or no Worker origin yet, lands every row as "Not read". The provenance
   line is the date of the last reconciliation the Worker reports. No animation here beyond the CSS fade
   (results.css), which reduced motion turns off; site.js owns the entrances. */
(() => {
'use strict';
const sec = document.getElementById('top'), rows = document.getElementById('rsRows'), when = document.getElementById('rsWhen');
const cells = [...rows.querySelectorAll('.rs-n')];
const seeded = document.getElementById('rsSeeded');
if (seeded && sec.dataset.seeded !== 'true') seeded.hidden = true;
const NOT = 'Not read';
const origin = (sec.dataset.worker || '').replace(/\/$/, '');
const url = /^https:\/\//.test(origin) ? origin + (sec.dataset.path || '/results') : null;
const day = ms => new Date(ms).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
const show = (cell, v) => {
  const k = cell.dataset.k;
  const text = v === null || v === undefined ? NOT
    : k === 'reserveRatio' ? (typeof v === 'number' ? v.toFixed(2) : NOT)
    : typeof v === 'number' ? Math.round(v).toLocaleString('en-US') : NOT;
  cell.textContent = text;
  cell.classList.toggle('not', text === NOT);
  cell.classList.add('in');
};
const land = (data) => {
  cells.forEach(c => show(c, data ? data[c.dataset.k] : null));
  const at = data && typeof data.reconciledAt === 'number' ? data.reconciledAt : null;
  when.textContent = at ? 'Checked ' + day(at) + '.' : data ? 'Not checked yet.' : 'Not read.';
  rows.setAttribute('aria-busy', 'false');
};
if (!url) { land(null); return; }
const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 8000);
fetch(url, { credentials: 'omit', signal: ctl.signal })
  .then(r => r.ok ? r.json() : null)
  .then(d => land(d && typeof d === 'object' ? d : null))
  .catch(() => land(null))
  .finally(() => clearTimeout(timer));
})();
</script>
