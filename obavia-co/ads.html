<script>
(() => {
  const vids=[...document.querySelectorAll('video')];
  vids.forEach(v=>{
    v.addEventListener('play',()=>{ vids.forEach(o=>{ if(o!==v) o.pause(); }); OBV.snd.duck(true); });   // one film at a time, and the page falls quiet
    v.addEventListener('pause',()=>{ if(vids.every(o=>o.paused)) OBV.snd.duck(false); });
    v.addEventListener('ended',()=>OBV.snd.duck(false));
  });
})();
</script>
