<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obavia · Films</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--ink:#1C2436;--body:#4B5468;--deep:#7D97C7;--line:#DCE4FA}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:Manrope,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#D8E3FC 0%,#F6F9FF 48%,#EEF3FF 100%)}
  header{display:flex;align-items:center;gap:12px;padding:22px 16px;max-width:1080px;margin:0 auto}
  header img{width:34px;height:34px} header a{color:inherit;text-decoration:none;font-weight:800;letter-spacing:-.02em;font-size:18px}
  main{max-width:1080px;margin:0 auto;padding:10px 16px 60px}
  h1{font-size:clamp(34px,5vw,56px);letter-spacing:-.045em;line-height:1.02;margin:10px 0 36px;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
  figure{margin:0} video{width:100%;aspect-ratio:9/16;border-radius:28px;background:#121A2E;display:block;box-shadow:0 50px 100px -50px rgba(40,52,79,.5)}
  figcaption{margin-top:14px;text-align:center;font-weight:700;color:var(--body)} figcaption b{color:var(--ink)}
  @media (max-width:700px){.grid{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header><img src="favicon.svg" alt=""><a href="index.html">Obavia</a></header>
<main>
  <h1>Two films. Two seats at the table.</h1>
  <div class="grid">
    <figure><video src="ads/obavia-ad-sales.mp4" poster="ads/obavia-ad-sales.jpg" controls playsinline preload="metadata"></video><figcaption><b>The closer</b> · 33s</figcaption></figure>
    <figure><video src="ads/obavia-ad-owner.mp4" poster="ads/obavia-ad-owner.jpg" controls playsinline preload="metadata"></video><figcaption><b>The owner</b> · 34s</figcaption></figure>
  </div>
</main>
</body>
</html>
