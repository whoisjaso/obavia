<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>OBAVIA | Operations</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#121212;color:#F5F0E6}
  body{font-family:'Montserrat','Helvetica Neue',Arial,sans-serif}
  a{color:inherit;text-decoration:none}
  .page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 18px;background:radial-gradient(circle at 50% 10%,rgba(184,155,94,.13),transparent 36%),#121212}
  .shell{width:min(100%,520px);text-align:center}
  .word{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:600;letter-spacing:.32em;padding-left:.32em;margin-top:18px}
  .kicker{font-size:11px;font-weight:700;letter-spacing:.36em;text-transform:uppercase;color:#b89b5e;margin-top:10px}
  .panel{margin-top:38px;border:1px solid rgba(184,155,94,.24);background:rgba(245,240,230,.035);border-radius:8px;padding:32px 28px}
  h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(2rem,7vw,2.8rem);line-height:1.05;margin:0 0 14px}
  p{font-size:14px;line-height:1.7;color:rgba(245,240,230,.68);margin:0 auto;max-width:39rem}
  .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:28px}
  .primary,.secondary{display:inline-flex;align-items:center;justify-content:center;min-height:48px;border-radius:4px;padding:0 20px;font-size:11.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
  .primary{background:#b89b5e;color:#121212}
  .secondary{border:1px solid rgba(184,155,94,.48);color:#b89b5e}
</style>
</head>
<body>
<main class="page">
  <section class="shell" aria-labelledby="ops-title">
    <svg width="56" height="68" viewBox="0 0 120 160" fill="none" stroke="#b89b5e" stroke-width="5" stroke-linecap="round" aria-hidden="true"><ellipse cx="50" cy="80" rx="30" ry="61"/><ellipse cx="70" cy="80" rx="30" ry="61"/><ellipse cx="60" cy="80" rx="38" ry="70" opacity=".72"/></svg>
    <div class="word">OBAVIA</div>
    <div class="kicker">Operations</div>
    <div class="panel">
      <h1 id="ops-title">Restricted access.</h1>
      <p>The operations portal is private and should only open through owner-managed authentication. Public admin access, seeded team accounts, and local browser records have been removed from this deployment.</p>
      <div class="actions">
        <a class="primary" href="./index.html">Return Home</a>
        <a class="secondary" href="./Obavia%20Vehicles.dc.html">View Application</a>
      </div>
    </div>
  </section>
</main>
<script>
  try {
    localStorage.removeItem("obavia_staff");
  } catch (e) {}
</script>
</body>
</html>
