# Ships obavia-co/ to obavia.co as a new version of the live Worker
# (obavia-waitlist). The waitlist API, its database, emails, secrets and
# cron carry over. After the upload it checks the live site and rolls back
# if any check fails. See deploy/site/README.md.
name: Deploy obavia.co

on:
  push:
    branches: [main]
    paths: ['obavia-co/**', 'deploy/site/**', '.github/workflows/deploy-site.yml']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Stop before uploading (reads the live Worker and stages the files only)
        type: boolean
        default: false

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage the site
        run: deploy/site/build.sh
      - name: Deploy and check
        run: node deploy/site/deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
